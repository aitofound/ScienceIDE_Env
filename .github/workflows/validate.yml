# The registry gatekeeper. Any pull request that touches tasks/**, the
# template, or the validator itself must leave the YAML in a shape the site
# can render; the same check runs on main so a bad direct push is caught
# rather than silently rendered. The rules themselves live in
# scripts/validate.mjs — this file only runs them.
name: validate

on:
  pull_request:
    paths: ['tasks/**', 'TEMPLATE.yaml', 'scripts/**']
  push:
    branches: [main]
    paths: ['tasks/**', 'TEMPLATE.yaml', 'scripts/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm ci is needed only for the yaml parser, but a partial install is
      # more fragile than a full one on a runner that starts cold anyway.
      - run: npm ci
      - run: npm run check
