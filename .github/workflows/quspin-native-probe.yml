name: QuSpin native example timing probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the pinned environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet --no-cache-dir setuptools wheel numpy scipy \
            quspin==1.0.1 parallel-sparse-tools==0.2.5 matplotlib networkx
      - name: Time example11.py natively on x86_64
        run: |
          cd code/quspin/examples/scripts
          export KMP_DUPLICATE_LIB_OK=TRUE OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 MPLBACKEND=Agg
          s=$(date +%s)
          timeout 1800 /tmp/venv/bin/python example11.py > /tmp/ex11.log 2>&1
          rc=$?
          e=$(date +%s)
          echo "example11.py rc=$rc elapsed=$((e-s))s"
          tail -5 /tmp/ex11.log
          echo "--- also time the other long ones for reference ---"
          for f in example1.py example2.py; do
            s=$(date +%s); timeout 1800 /tmp/venv/bin/python "$f" >/dev/null 2>&1; rc=$?; e=$(date +%s)
            echo "$f rc=$rc elapsed=$((e-s))s"
          done
