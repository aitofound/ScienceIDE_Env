name: QuSpin full-steward selfcheck

# Manual only. The repository has no per-task workflow and every merged task PR
# touches no .github/ path; this job exists solely because the QuSpin image is
# linux/amd64 and its full selfcheck is impractical on an arm64 host under
# emulation. Nothing here runs automatically: `validate` already fails when the
# committed self-validation record goes stale, so a contract change is caught
# without this job. Use the Run workflow button when a fresh x86 record is
# needed, then commit the refreshed comment/pipeline/ files it uploads.
on:
  workflow_dispatch:

concurrency:
  group: quspin-full-selfcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-selfcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      # The two task images together are about 5.4 GB on disk and the runner's
      # default volume is ~14 GB, which is not enough once BuildKit's cache and
      # the second image are added: the build fails with "No space left on
      # device" while pip installs the MKL stack that example27.py needs. Drop
      # the preinstalled toolchains this job does not use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install task tooling
        run: npm install --ignore-scripts
      - name: Decide whether a fresh record already exists
        id: freshness
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'skills/package-sciaccel-task/scripts')
          from _vendor.sciaccel_pipeline.util import contract_fingerprint
          leaf = Path('tasks/quspin/quspin')
          current = contract_fingerprint(leaf)
          try:
              recorded = json.loads((leaf / 'comment/pipeline/self-validation.json').read_text()).get('contract_fingerprint')
          except Exception:
              recorded = None
          fresh = current == recorded
          print(f"needed={'false' if fresh else 'true'}")
          print(f"reason={'record matches the current tree' if fresh else 'record missing or stale'}", file=sys.stderr)
          PYEOF
      - name: Record CI run consent
        if: steps.freshness.outputs.needed == 'true'
        run: |
          python3 skills/package-sciaccel-task/scripts/sab.py task consent \
            --task tasks/quspin/quspin --where local \
            --human-ref 'Requester authorized the full QuSpin steward nominal/variant selfcheck in CI.'
      - name: Build both task images
        if: steps.freshness.outputs.needed == 'true'
        run: python3 skills/package-sciaccel-task/scripts/sab.py task build --task tasks/quspin/quspin
      - name: Run complete nominal and variant selfcheck
        if: steps.freshness.outputs.needed == 'true'
        run: python3 skills/package-sciaccel-task/scripts/sab.py task selfcheck --task tasks/quspin/quspin
      - name: Upload selfcheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quspin-full-selfcheck-evidence
          path: |
            /home/runner/.sciaccel_pipeline/quspin
            tasks/quspin/quspin/comment/pipeline
            tasks/quspin/quspin/tests/checks/*/rubric.json
          if-no-files-found: warn
