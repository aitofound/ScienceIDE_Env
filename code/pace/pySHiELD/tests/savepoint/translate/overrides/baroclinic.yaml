Driver:
  - ignore_near_zero_errors:
      uc: 1e-13
      vc: 1e-13
      mfxd: 1e-3
      mfyd: 1e-3
      cxd: 1e-3
      cyd: 1e-3

GFSPhysicsDriver:
  - backend: st:numpy:cpu:IJK
    max_error: 1e-10
  - backend: st:gt:cpu:KJI
    max_error: 1e-10
  - backend: st:gt:gpu:KJI
    cuda_no_fma: true
  - backend: orch:dace:gpu:KJI
    cuda_no_fma: true
    ignore_near_zero_errors:
      IPD_rain: 1e-12
      IPD_qice: 1e-12
      IPD_qgraupel: 1e-12

# On GPU u/v wind tendencies seems to diverge in computation from numpy/fortran
# equivalent due to the use of fused multiply-add in the update stencil.
# For validation we deactivate it (for validation only!)
Microph:
  - backend: st:numpy:cpu:IJK
    max_error: 2e-10
  - backend: st:gt:cpu:KJI
    max_error: 6e-11
  - backend: st:gt:gpu:KJI
    max_error: 2.2e-8
    cuda_no_fma: true
    ignore_near_zero_errors:
      mph_ql_dt: 1e-8
      mph_qr_dt: 1e-9
      mph_qg_dt: 1e-18
  - backend: orch:dace:gpu:KJI
    max_error: 2.2e-8
    cuda_no_fma: true
    ignore_near_zero_errors:
      mph_ql_dt: 1e-8
      mph_qr_dt: 1e-9
      mph_qg_dt: 1e-18
      mph_udt: 1e-8
      mph_vdt: 1e-8
  - backend: orch:dace:cpu:KIJ
    max_error: 2.2e-8
    cuda_no_fma: true
    ignore_near_zero_errors:
      mph_ql_dt: 1e-8
      mph_qr_dt: 1e-9
      mph_qg_dt: 1e-18
      mph_udt: 1e-8
      mph_vdt: 1e-8
