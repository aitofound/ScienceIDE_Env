    cuda_no_fma: true
    ignore_near_zero_errors:
      mph_ql_dt: 1e-8
      mph_qr_dt: 1e-9
      mph_qg_dt: 1e-18
      mph_udt: 1e-8
      mph_vdt: 1e-8

