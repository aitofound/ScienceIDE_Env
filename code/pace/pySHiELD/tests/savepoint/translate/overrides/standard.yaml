Microph:
  - backend: st:numpy:cpu:IJK
    max_error: 2e-9
  - backend: st:gt:cpu:KJI
    max_error: 1e-12
  - backend: st:gt:gpu:KJI
    max_error: 2.2e-8
    cuda_no_fma: true
    ignore_near_zero_errors:
      mph_ql_dt: 1e-8
      mph_qr_dt: 1e-9
      mph_qg_dt: 1e-18
  - backend: orch:dace:cpu:KIJ
    max_error: 2.2e-8
    cuda_no_fma: true
    ignore_near_zero_errors:
      mph_ql_dt: 1e-8
      mph_qr_dt: 1e-9
      mph_qg_dt: 1e-18
      mph_udt: 1e-8
      mph_vdt: 1e-8
  - backend: orch:dace:gpu:KJI
