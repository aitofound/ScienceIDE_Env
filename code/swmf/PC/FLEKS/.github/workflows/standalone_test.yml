name: Standalone Test

on:
  pull_request:
    branches: [ "master" ]

jobs:
  # Standalone job building against the 3D AMReX library (-amrex3d).
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout FLEKS (for local composite actions)
        uses: actions/checkout@v6

      - name: Setup SWMF dependency tree
        uses: ./.github/actions/setup-swmf
        with:
          fleks-path: SWMF/PC/FLEKS
          fleks-cache-exclude: PC/FLEKS
          amrex-cache-suffix: 3d
          config-components: PC/FLEKS,GM/BATSRUS
          verify-amrex: 'true'

      - name: Build and test standalone FLEKS (3D)
        uses: ./.github/actions/build-test-standalone
        with:
          amrex-dim: 3d
          cache-key: fleks-standalone-v3
          serial-summary: summary_serial.md
          parallel-summary: summary_parallel.md
          summary-title: Standalone FLEKS Test Results
          post-pr-comment: 'true'

  # Standalone job building against the true-2D AMReX library (-amrex2d).
  build-and-test-2d:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout FLEKS (for local composite actions)
        uses: actions/checkout@v6

      - name: Setup SWMF dependency tree
        uses: ./.github/actions/setup-swmf
        with:
          fleks-path: SWMF/PC/FLEKS
          fleks-cache-exclude: PC/FLEKS
          amrex-cache-suffix: 2d
          config-components: PC/FLEKS,GM/BATSRUS
          verify-amrex: 'true'

      - name: Build and test standalone FLEKS (2D)
        uses: ./.github/actions/build-test-standalone
        with:
          amrex-dim: 2d
          cache-key: fleks-standalone-2d-v2
          serial-summary: summary_2d_serial.md
          parallel-summary: summary_2d_parallel.md
          summary-title: Standalone FLEKS 2D AMReX Test Results
          post-pr-comment: 'false'

  # Compiler warning check against the true-2D AMReX library (-amrex2d).
  # This is a separate job on purpose: it compiles FLEKS unoptimized
  # (-debug -O0), so it must never share a workspace with the job that builds
  # the optimized executable used to run the tests.
  warning-check-2d:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout FLEKS (for local composite actions)
        uses: actions/checkout@v6

      - name: Setup SWMF dependency tree
        uses: ./.github/actions/setup-swmf
        with:
          fleks-path: SWMF/PC/FLEKS
          fleks-cache-exclude: PC/FLEKS
          amrex-cache-suffix: 2d
          config-components: PC/FLEKS,GM/BATSRUS
          verify-amrex: 'true'

      - name: Check for compiler warnings (2D, -debug -O0)
        uses: ./.github/actions/warning-check
        with:
          amrex-dim: 2d
          warning-summary: warning_check_2d.md
          summary-title: FLEKS 2D AMReX Compiler Warning Check
