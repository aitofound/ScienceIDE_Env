name: SWMF GM-PC Integration Test

on:
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FLEKS (for local composite actions)
        uses: actions/checkout@v6

      - name: Setup SWMF dependency tree
        uses: ./.github/actions/setup-swmf
        with:
          fleks-path: SWMF/PC/FLEKS
          fleks-cache-exclude: PC/FLEKS
          # GM-PC runs both 2D (test16_2d, test23_2d) and 3D (the rest) AMReX
          # builds, so the AMReX cache key encodes both dimensions.
          amrex-cache-suffix: 2d3d
          config-components: PC/FLEKS,GM/BATSRUS
          verify-amrex: 'true'

      - name: Build and Run test16_2d
        working-directory: SWMF
        run: |
          make -j$(nproc) test16_2d

      - name: Build and Run test16_3d
        working-directory: SWMF
        run: |
          make -j$(nproc) test16_3d

      - name: Build and Run test17
        working-directory: SWMF
        run: |
          make -j$(nproc) test17

      - name: Build and Run test18
        working-directory: SWMF
        run: |
          make -j$(nproc) test18

      - name: Build and Run test23_2d
        working-directory: SWMF
        run: |
          make -j$(nproc) test23_2d

      - name: Build and Run test23_3d
        working-directory: SWMF
        run: |
          make -j$(nproc) test23_3d

      - name: Build and Run test25
        working-directory: SWMF
        run: |
          make -j$(nproc) test25

      - name: Verify Test Results
        working-directory: SWMF
        run: |
          FAILED=0
          for diff_file in test16_2d_gmpc.diff test16_3d_gmpc.diff \
                           test17_gmpc.diff test18_gmpc.diff \
                           test23_2d_gmpc.diff test23_3d_gmpc.diff \
                           test25_gmpc.diff; do
            if [ -s "$diff_file" ]; then
              echo "::error::Test verification failed! Non-zero diff detected in $diff_file"
              cat "$diff_file"
              FAILED=1
            else
              echo "Test verification successful for $diff_file! Diff is empty."
            fi
          done

          if [ $FAILED -ne 0 ]; then
            exit 1
          fi
