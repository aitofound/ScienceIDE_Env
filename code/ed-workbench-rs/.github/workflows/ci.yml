name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2.9.1
      - name: Install locked uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12.11"
          enable-cache: true
      - name: Verify and install the locked oracle environment
        run: |
          uv lock --check
          uv sync --locked
      - name: Verify submission
        env:
          PYTHON: .venv/bin/python
        run: scripts/verify-submission.sh

  minimum-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust 1.89.0
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Check minimum Rust version
        run: cargo +1.89.0 check --locked
