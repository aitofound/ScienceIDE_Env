# Offline transcription of Takasu 2011 IPNT-J seminar, slide 39.
# RTKLIB 2.4.2 p13: explicit ionosphere-free dual-frequency combination.
# Pinned bundled igs05.atx replaces screenshot-only igs05_1604.atx.
pos1-posmode=ppp-kine
pos1-frequency=l1+l2
pos1-soltype=combined
pos1-elmask=10
pos1-dynamics=off
pos1-tidecorr=on
pos1-ionoopt=dual-freq
pos1-tropopt=est-ztd
pos1-sateph=precise
pos1-navsys=1
pos1-posopt1=on
pos1-posopt2=on
pos1-posopt3=on
pos1-posopt4=off
pos1-posopt5=off
pos2-armode=off
pos2-niter=1
out-solformat=xyz
out-outhead=on
out-outopt=on
out-timesys=gpst
out-timeform=hms
out-timendec=3
out-solstatic=all
out-outstat=off
ant1-anttype=*
file-satantfile=@ANTEX@
file-rcvantfile=@ANTEX@
